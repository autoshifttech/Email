name: Android APK

# Builds the MailBridge Android app and publishes it to the website
# (public/downloads/mailbridge.apk → https://<your-app>/download).
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Optional permanent signing key (recommended): add repository secrets
      # ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using the release key from secrets."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret, signing with a cached debug key. Add the secret for a permanent key."
          fi

      # Without a release key, keep the debug key stable between runs so updates install over the old app.
      - name: Restore debug key
        if: env.ANDROID_KEYSTORE_PATH == ''
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mailbridge-debug-keystore-v1

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName=1.0.${{ github.run_number }} \
            -PappUrl="$APP_URL"

      - name: Publish to website folder
        run: |
          mkdir -p public/downloads
          cp android/app/build/outputs/apk/release/app-release.apk public/downloads/mailbridge.apk
          SIZE=$(stat -c%s public/downloads/mailbridge.apk)
          SHA=$(sha256sum public/downloads/mailbridge.apk | cut -d' ' -f1)
          cat > public/downloads/latest.json <<JSON
          {"versionName":"1.0.${{ github.run_number }}","versionCode":${{ github.run_number }},"size":$SIZE,"sha256":"$SHA","builtAt":"$(date -u +%Y-%m-%dT%H:%M:%SZ)","file":"/downloads/mailbridge.apk"}
          JSON
          cat public/downloads/latest.json

      - uses: actions/upload-artifact@v4
        with:
          name: mailbridge-apk
          path: public/downloads/mailbridge.apk

      - name: Commit APK (triggers a Vercel deploy)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/mailbridge.apk public/downloads/latest.json
          git commit -m "Android APK v1.0.${{ github.run_number }}"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
